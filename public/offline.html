<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yasashi Japanese 离线中</title>
    <meta name="theme-color" content="#ffb7b2" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7f5;
        color: #241f1f;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgb(36 31 31 / 0.12);
        border-radius: 16px;
        background: rgb(255 255 255 / 0.82);
        padding: 28px;
        box-shadow: 0 20px 60px rgb(36 31 31 / 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: rgb(36 31 31 / 0.66);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        color: inherit;
        font-weight: 700;
        text-underline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #171312;
          color: #f6efec;
        }

        main {
          border-color: rgb(246 239 236 / 0.16);
          background: rgb(37 31 30 / 0.86);
          box-shadow: none;
        }

        p {
          color: rgb(246 239 236 / 0.68);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>已缓存的页面和笔顺资源仍可使用；新的课程内容需要网络恢复后再加载。学习进度不会被 service worker 缓存或覆盖。</p>
      <a href="/">回到首页</a>
    </main>
  </body>
</html>
