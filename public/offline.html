<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yasashi Japanese 离线中</title>
    <meta name="theme-color" content="#facc15" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #fdf6e3;
        color: #1a1a2e;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        border: 3px solid #1a1a2e;
        background: #fffef9;
        padding: 28px;
        box-shadow: 4px 4px 0 #1a1a2e;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #555570;
        line-height: 1.7;
        font-weight: 600;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        color: inherit;
        font-weight: 800;
        border: 3px solid #1a1a2e;
        background: #facc15;
        padding: 8px 14px;
        box-shadow: 3px 3px 0 #1a1a2e;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #000;
          color: #f0f0f0;
        }

        main {
          border-color: #2a2a2a;
          background: #050505;
          box-shadow: 4px 4px 0 #173a52;
        }

        p {
          color: #a3a3a3;
        }

        a {
          background: #173a52;
          color: #f0f4f8;
          border-color: #2a2a2a;
          box-shadow: 3px 3px 0 #0c1e2b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>已缓存的页面和笔顺资源仍可使用；新的课程内容需要网络恢复后再加载。学习进度不会被 service worker 缓存或覆盖。</p>
      <a href="/">回到首页</a>
    </main>
  </body>
</html>
