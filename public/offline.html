<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>優しい Yasashi · 离线中</title>
    <meta name="theme-color" content="#fffdf9" />
    <style>
      :root {
        color-scheme: light;
        --base: #fffdf9;
        --panel: #ffffff;
        --ink: #24283f;
        --muted: #51556e;
        --blue: #87b9e2;
        --pink: #e980a8;
        --yellow: #f3da87;
        font-family: "Yu Gothic UI", "Microsoft YaHei UI", sans-serif;
        background: var(--base);
        color: var(--ink);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 0 0, rgba(135, 185, 226, 0.16), transparent 65%), var(--base);
      }

      main {
        position: relative;
        width: min(100%, 480px);
        border: 1px solid var(--pink);
        border-radius: 20px;
        background: var(--panel);
        padding: 34px 30px;
        box-shadow: 0 16px 50px rgba(79, 57, 97, 0.1);
      }

      main::before {
        position: absolute;
        top: -2px;
        left: 30px;
        width: 96px;
        height: 5px;
        border-radius: 3px;
        background: var(--pink);
        content: "";
      }

      .mark {
        display: grid;
        width: 54px;
        height: 54px;
        margin-bottom: 26px;
        border: 1px solid var(--pink);
        border-radius: 50%;
        background: var(--base);
        font-size: 22px;
        font-weight: 800;
        place-items: center;
      }

      h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
      h1 small { display: block; margin-top: 8px; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: 0; }
      p { margin: 20px 0 0; color: var(--muted); line-height: 1.8; }

      a {
        display: inline-flex;
        min-height: 44px;
        margin-top: 26px;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--ink);
        color: var(--panel);
        padding: 8px 18px;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --base: #1e202b;
          --panel: #23233b;
          --ink: #f3eef8;
          --muted: #c3bdd5;
          --blue: #9ec6ef;
          --pink: #f2a8c7;
          --yellow: #eed49a;
        }

        a { color: var(--base); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">休</div>
      <h1>当前离线 <small>网络恢复后即可继续同步内容</small></h1>
      <p>已缓存的页面和笔顺资源仍可使用；新的课程内容需要网络恢复后再加载。已保存的学习进度仍保存在当前浏览器。</p>
      <a href="/">回到首页</a>
    </main>
  </body>
</html>
