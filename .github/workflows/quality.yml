name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release:
        description: "Run strict browser and PWA release gates"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Merge Gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run merge gate
        run: npm run check

  detect-pwa-changes:
    name: Detect PWA Changes
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect PWA-impacting changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt

          if grep -E '^(public/(sw\.js|manifest\.webmanifest|offline\.html|apple-touch-icon\.png|favicon\.ico|icons/.*|brand/.*|assets/.*|animcjk/.*)|src/app/(globals\.css|layout\.tsx|page\.tsx|(path|grammar|learn|kana|vocabulary|quiz|review|semantics|pragmatics)/.*)|src/components/(home|path|layout|learning|lesson|kana|vocabulary|quiz|review|reference|ui)/.*|src/components/(mode-toggle|theme-provider|pwa-register)\.tsx|src/lib/(animcjk|answer-option-feedback|grammar|home|kana|keyboard-shortcuts|learning|lesson|mistake|path|pwa-navigation|question-options|questions|quiz|review|skill-tree|speech|srs|storage-keys|use-indexed-modal-navigation|verb-conjugation|vocab|vocabulary).*\.ts|src/data/(lessons\.ts|kana-data\.ts|vocabulary/.*|grammar-data\.ts|semantics-data\.ts|pragmatics-data\.ts)|tests/e2e/(pwa-offline\.mjs|harness\.mjs|storage-keys\.mjs|browser-fixtures\.mjs|browser-fixture-.*\.mjs)|package\.json|package-lock\.json)$' changed-files.txt > /dev/null; then
            echo "pwa=true" >> "$GITHUB_OUTPUT"
          else
            echo "pwa=false" >> "$GITHUB_OUTPUT"
          fi

  detect-browser-changes:
    name: Detect Browser E2E Changes
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect browser-flow-impacting changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt

          if grep -E '^(src/app/(globals\.css|layout\.tsx|page\.tsx|(path|learn|kana|vocabulary|quiz|review|grammar|semantics|pragmatics)/.*)|src/components/(home|path|layout|learning|lesson|practice|kana|vocabulary|quiz|review|reference|ui)/.*|src/components/(mode-toggle|theme-provider|pwa-register)\.tsx|src/lib/(animcjk|answer-option-feedback|grammar|home|kana|keyboard-shortcuts|learning|lesson|mistake|path|pwa-navigation|question-options|questions|quiz|review|skill-tree|speech|srs|storage-keys|use-indexed-modal-navigation|verb-conjugation|vocab|vocabulary).*\.ts|src/data/(lessons\.ts|kana-data\.ts|vocabulary/.*|grammar-data\.ts|semantics-data\.ts|pragmatics-data\.ts)|tests/e2e/(browser\.mjs|browser-.*\.mjs|harness\.mjs|storage-keys\.mjs)|package\.json|package-lock\.json)$' changed-files.txt > /dev/null; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  browser-check:
    name: Browser Interaction Gate
    needs: detect-browser-changes
    if: ${{ needs.detect-browser-changes.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npm run e2e:install:ci

      - name: Run strict browser interaction gate
        run: npm run e2e:browser:required

  pwa-check:
    name: PWA Browser Gate
    needs: detect-pwa-changes
    if: ${{ needs.detect-pwa-changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npm run e2e:install:ci

      - name: Run strict PWA gate
        run: npm run e2e:pwa:required

  release-check:
    name: Release Gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npm run e2e:install:ci

      - name: Run release gate
        run: npm run check:release
